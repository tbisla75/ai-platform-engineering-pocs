name: Python POC Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workflow dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q k8s-incident-agent gpu-readiness-analyzer tests
      - name: Run unit and agent tests
        run: python -m unittest discover -s tests -v
      - name: Run offline agent with synthetic incident
        run: python k8s-incident-agent/agent.py --fixture k8s-incident-agent/sample.json --offline
